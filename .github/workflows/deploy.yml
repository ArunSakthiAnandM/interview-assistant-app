name: Build and Deploy Interview Assistant App

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Build Backend
  build-backend:
    name: Build Spring Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Load Backend Properties
        run: |
          echo "Loading properties from GitHub environment..."
          echo "MONGO_DB_URI=${{ secrets.MONGO_DB_URI }}" >> $GITHUB_ENV
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
          echo "AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}" >> $GITHUB_ENV
          echo "AWS_S3_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_S3_BUCKET_NAME=${{ vars.S3_DOCUMENTS_BUCKET }}" >> $GITHUB_ENV

      - name: Build with Maven
        working-directory: ./backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Run Tests
        working-directory: ./backend
        run: ./mvnw test

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 5

  # Job 2: Build Frontend
  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Load Frontend Environment Variables
        run: |
          echo "API_URL=${{ vars.API_URL }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ vars.ENVIRONMENT_NAME }}" >> $GITHUB_ENV

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular App
        working-directory: ./frontend
        run: |
          npm run build -- --configuration=production

      - name: Run Tests
        working-directory: ./frontend
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 5

  # Job 3: Deploy Backend to Elastic Beanstalk
  deploy-backend:
    name: Deploy Backend to Elastic Beanstalk
    needs: build-backend
    runs-on: ubuntu-latest
    # Only deploy on push to main or develop
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ vars.BACKEND_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend/target

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate Deployment Package
        run: |
          cd backend/target
          # Find the JAR file
          JAR_FILE=$(ls *.jar | grep -v '.original')
          echo "Found JAR: $JAR_FILE"

          # Create deployment package with JAR and Procfile
          mkdir -p deploy
          cp $JAR_FILE deploy/application.jar

          # Create Procfile for Elastic Beanstalk
          echo "web: java -jar application.jar" > deploy/Procfile

          # Zip the package
          cd deploy
          zip -r ../deployment-package.zip .
          cd ..
          echo "Deployment package created: deployment-package.zip"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ vars.EB_APPLICATION_NAME }}
          environment_name: ${{ vars.EB_ENVIRONMENT_NAME }}
          version_label: backend-${{ github.sha }}
          region: ${{ vars.AWS_REGION }}
          deployment_package: backend/target/deployment-package.zip
          wait_for_environment_recovery: 300

      - name: Verify Deployment
        run: |
          echo "Backend deployed to: ${{ vars.BACKEND_URL }}"
          echo "Waiting for application to be healthy..."
          sleep 30
          curl -f ${{ vars.BACKEND_URL }}/actuator/health || echo "Health check failed, but deployment may still be in progress"

  # Job 4: Deploy Frontend to S3 and CloudFront
  deploy-frontend:
    name: Deploy Frontend to S3/CloudFront
    needs: build-frontend
    runs-on: ubuntu-latest
    # Only deploy on push to main or develop
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ vars.FRONTEND_URL }}

    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        run: |
          echo "Deploying to S3 bucket: ${{ vars.S3_BUCKET_NAME }}"
          # Angular build outputs to dist/interview-organiser/browser/
          aws s3 sync ./dist/interview-organiser/browser/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"

          # Deploy HTML and JSON files with shorter cache
          aws s3 sync ./dist/interview-organiser/browser/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          echo "Invalidating CloudFront distribution: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Verify Deployment
        run: |
          echo "Frontend deployed to: ${{ vars.FRONTEND_URL }}"
          echo "Waiting for CloudFront invalidation..."
          sleep 10

  # Job 5: Notify Deployment Status
  notify:
    name: Notify Deployment Status
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Check Deployment Status
        run: |
          if [[ "${{ needs.deploy-backend.result }}" == "success" ]] && [[ "${{ needs.deploy-frontend.result }}" == "success" ]]; then
            echo "✅ Both backend and frontend deployed successfully!"
            echo "STATUS=success" >> $GITHUB_ENV
          else
            echo "❌ Deployment failed!"
            echo "Backend: ${{ needs.deploy-backend.result }}"
            echo "Frontend: ${{ needs.deploy-frontend.result }}"
            echo "STATUS=failure" >> $GITHUB_ENV
          fi

      # Optional: Add Slack/Email/Teams notification here
      # - name: Send Slack Notification
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ env.STATUS }}
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
