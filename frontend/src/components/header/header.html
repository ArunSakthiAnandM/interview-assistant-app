<mat-toolbar class="app-header" color="primary">
  <div class="header-content">
    <!-- Left Section: Logo -->
    <div class="header-left">
      <a [routerLink]="['/']" class="app-logo">
        <mat-icon class="logo-icon">work</mat-icon>
        <span class="logo-text">Interview Organiser</span>
      </a>
    </div>

    <!-- Center Section: Navigation (Desktop) -->
    @if (isAuthenticated()) {
    <nav class="header-nav">
      @for (item of navigationItems(); track item.route) {
      <a [routerLink]="['/' + item.route]" routerLinkActive="active" class="nav-link" mat-button>
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
      }
    </nav>
    }

    <!-- Right Section: Actions & User Menu -->
    <div class="header-right">
      @if (isAuthenticated()) {
      <!-- Notifications -->
      <button
        mat-icon-button
        (click)="goToNotifications()"
        aria-label="Notifications"
        [matBadge]="unreadCount()"
        [matBadgeHidden]="unreadCount() === 0"
        matBadgeColor="warn"
        matBadgeSize="small"
      >
        <mat-icon>notifications</mat-icon>
      </button>

      <!-- User Menu -->
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
        <div class="user-avatar">{{ getUserInitials() }}</div>
        <span class="user-name">{{ user()?.name }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu" class="user-menu">
        <div class="user-menu-header">
          <div class="user-avatar-large">{{ getUserInitials() }}</div>
          <div class="user-info">
            <div class="user-name">{{ user()?.name }}</div>
            <div class="user-email">{{ user()?.email }}</div>
            <div class="user-role">{{ userRole() }}</div>
          </div>
        </div>

        <mat-divider></mat-divider>

        <button mat-menu-item (click)="goToProfile()">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>

        <button mat-menu-item (click)="goToSettings()">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>

        <mat-divider></mat-divider>

        <button mat-menu-item (click)="logout()" class="logout-button">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
      } @else {
      <!-- Guest Actions -->
      <a [routerLink]="['/' + ROUTES.LOGIN]" mat-button>Login</a>
      <a [routerLink]="['/' + ROUTES.REGISTER]" mat-raised-button color="accent">Sign Up</a>
      }
    </div>
  </div>
</mat-toolbar>
