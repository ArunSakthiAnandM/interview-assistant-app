<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Recruiter Dashboard</h1>
    <p>Manage your interviews and candidates</p>
  </div>

  <div class="stats-grid">
    <mat-card class="stat-card primary">
      <mat-card-content>
        <div class="stat-icon"><mat-icon>work</mat-icon></div>
        <div class="stat-details">
          <div class="stat-value">{{ stats().interviewsCreated || 0 }}</div>
          <div class="stat-label">Interviews Created</div>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card success">
      <mat-card-content>
        <div class="stat-icon"><mat-icon>people</mat-icon></div>
        <div class="stat-details">
          <div class="stat-value">{{ stats().candidatesInPipeline || 0 }}</div>
          <div class="stat-label">Candidates in Pipeline</div>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card warning">
      <mat-card-content>
        <div class="stat-icon"><mat-icon>pending</mat-icon></div>
        <div class="stat-details">
          <div class="stat-value">{{ stats().pendingDecisions || 0 }}</div>
          <div class="stat-label">Pending Decisions</div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-card class="actions-card">
    <mat-card-header><mat-card-title>Quick Actions</mat-card-title></mat-card-header>
    <mat-card-content>
      <div class="actions-grid">
        <button
          mat-raised-button
          color="primary"
          (click)="navigateTo(ROUTES.RECRUITER.INTERVIEW_CREATE)"
        >
          <mat-icon>add</mat-icon>
          Create Interview
        </button>
        <button mat-raised-button color="primary" (click)="navigateTo(ROUTES.RECRUITER.INTERVIEWS)">
          <mat-icon>list</mat-icon>
          View All Interviews
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
