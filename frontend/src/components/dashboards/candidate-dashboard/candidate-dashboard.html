<div class="dashboard-container">
      <div class="dashboard-header">
        <h1>Candidate Dashboard</h1>
        <p>Track your interview journey</p>
      </div>

      <div class="stats-grid">
        <mat-card class="stat-card primary">
          <mat-card-content>
            <div class="stat-icon"><mat-icon>work</mat-icon></div>
            <div class="stat-details">
              <div class="stat-value">{{ stats().appliedInterviews || 0 }}</div>
              <div class="stat-label">Applied Interviews</div>
            </div>
          </mat-card-content>
        </mat-card>

        <mat-card class="stat-card warning">
          <mat-card-content>
            <div class="stat-icon"><mat-icon>pending</mat-icon></div>
            <div class="stat-details">
              <div class="stat-value">{{ roundStatuses().pending || 0 }}</div>
              <div class="stat-label">Pending Rounds</div>
            </div>
          </mat-card-content>
        </mat-card>

        <mat-card class="stat-card success">
          <mat-card-content>
            <div class="stat-icon"><mat-icon>check_circle</mat-icon></div>
            <div class="stat-details">
              <div class="stat-value">{{ roundStatuses().completed || 0 }}</div>
              <div class="stat-label">Completed Rounds</div>
            </div>
          </mat-card-content>
        </mat-card>
      </div>

      <mat-card class="actions-card">
        <mat-card-header><mat-card-title>Quick Actions</mat-card-title></mat-card-header>
        <mat-card-content>
          <div class="actions-grid">
            <button
              mat-raised-button
              color="primary"
              (click)="navigateTo(ROUTES.CANDIDATE.INTERVIEWS)"
            >
              <mat-icon>list</mat-icon>
              View Interviews
            </button>
            <button
              mat-raised-button
              color="primary"
              (click)="navigateTo(ROUTES.CANDIDATE.PROFILE)"
            >
              <mat-icon>person</mat-icon>
              My Profile
            </button>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
